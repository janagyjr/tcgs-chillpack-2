
[Smoke]
	#Default smoke color in ARGB (Alpha, Red, Green, Blue) hex format (0xaarrggbb)
	defaultColor = -1
	#Maximum smoke particles amount per chimney
	#Range: 1 ~ 100
	maxAmount = 18
	#Maximum smoke blow out distance
	#Range: 0.0 ~ 20.0
	maxIntencity = 4.0
	#Maximum smoke particles scale
	#Range: 1.0 ~ 10.0
	maxScale = 2.5
	#Maximum smoke particles render distance
	#Range: 16 ~ 256
	maxRenderDistance = 128
	#Whether to replace vanilla smoke particles from a campfire or not
	replaceVanillaCampfireSmoke = true
	#Whether smoke causes poisoning to animals
	poisonAnimals = true
	#Whether smoke causes poisoning to hostile mobs
	poisonHostileMobs = true
	#Whether smoke causes poisoning to non-playable characters
	poisonNPCs = true
	#Whether smoke causes poisoning to players
	poisonPlayers = true
	#Emit smoke particles from vanilla fire blocks
	emitFromFireBlock = true

[Pipe]
	#Number of pipes that can be placed(when holding pipe items in both hands) / broken(when crouching) at once
	#Range: 1 ~ 128
	maxPipesAtOnce = 8

[Vent]
	#These settings are shared between several mods and therefore located in forgeendertech-common.toml
	"whereAreTheSettings?" = ["I've read the hint and understood"]

[Pump]
	#Power source required for the pump to operate
	#Allowed Values: NONE, REDSTONE, FORGE_ENERGY, KINETIC_ENERGY
	powerSource = "REDSTONE"

	[Pump.ForgeEnergy]
		#Maximum amount of energy that can be held
		#Range: 0 ~ 100000
		capacity = 10000
		#Amount of energy consumed per operation or second
		#Range: 0 ~ 1000
		consumption = 50

	[Pump.KineticEnergy]
		#Minimal rotation speed in RPM required to activate the pump
		#Range: 1 ~ 256
		minActivationSpeed = 16

[Painting]
	#These settings are shared between several mods and therefore located in forgeendertech-common.toml
	"whereAreTheSettings?" = ["I've read the hint and understood"]

[Chimney]
	#Light occlusion strength for narrow chimneys. Higher values darken interiors
	#Range: 0 ~ 15
	narrowChimneyLightDampening = 5
	#Light occlusion strength for full-sized chimneys. Higher values darken interiors
	#Range: 0 ~ 15
	fullSizedChimneyLightDampening = 10

